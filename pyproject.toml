[project]
name = "write-agent"
version = "0.1.0"
description = "Write Agent project skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "playwright",
    "httpx",
    "langgraph>=1.2,<1.3",
]

[project.scripts]
write-agent = "app.launch:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
